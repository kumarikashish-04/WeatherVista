<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather App — Simple & Clean</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
    :root{
      --bg:#0f172a; --card:#0b1220; --accent:#38bdf8; --glass: rgba(255,255,255,0.05);
      --text:#e6eef8; --muted:#9fb0c8;
    }
    body{
      min-height:100vh;
      background: linear-gradient(180deg,var(--bg),#071026 80%);
      display:flex;align-items:center;justify-content:center;padding:20px;
      color:var(--text);
    }
    .container{
      width:100%;
      max-width:920px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius:16px; padding:22px; box-shadow: 0 10px 30px rgba(2,6,23,0.6);
      display:grid; grid-template-columns: 1fr 360px; gap:20px;
      align-items:start;
      backdrop-filter: blur(6px);
    }
    .left{ padding:18px; }
    .search{ display:flex; gap:10px; margin-bottom:14px; }
    .search input{
      flex:1; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.06);
      background:var(--glass); color:var(--text); outline:none; font-size:15px;
    }
    .search button{
      padding:12px 14px; border-radius:10px; border:none; background:var(--accent); color:#042033;
      cursor:pointer; font-weight:600;
    }
    .meta{
      display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
    }
    .city{ font-size:24px; font-weight:700; }
    .small{ color:var(--muted); font-size:13px; }
    .weather-card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      padding:18px; border-radius:12px; display:flex; gap:18px; align-items:center;
    }
    .icon{
      width:110px; height:110px; display:flex; align-items:center; justify-content:center;
      border-radius:12px; background:rgba(255,255,255,0.03);
      font-size:48px;
    }
    .details{ flex:1; }
    .temp{ font-size:44px; font-weight:700; margin-bottom:6px; }
    .desc{ text-transform:capitalize; color:var(--muted); margin-bottom:8px;}
    .stats{ display:flex; gap:12px; color:var(--muted); font-size:14px; flex-wrap:wrap; }
    .stat{ background:rgba(255,255,255,0.02); padding:8px 10px; border-radius:8px; }
    .right{ padding:18px; }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px; padding:16px; margin-bottom:14px;
    }
    .toggle{ display:flex; gap:8px; align-items:center; }
    .btn-geo{ margin-top:8px; padding:8px 10px; border-radius:8px; border:none; background:transparent; color:var(--accent); cursor:pointer; }
    @media (max-width:880px){
      .container{ grid-template-columns: 1fr; }
      .icon{ width:90px; height:90px; font-size:40px; }
      .temp{ font-size:36px; }
    }
  </style>
</head>
<body>
  <div class="container" id="page">
    <div class="left">
      <div class="search">
        <input id="cityInput" type="text" placeholder="Enter city e.g. Mumbai" />
        <button id="searchBtn">Search</button>
      </div>

      <div class="meta">
        <div>
          <div class="city" id="cityName">—</div>
          <div class="small" id="timeLocal">—</div>
        </div>
        <div class="small">Last: <span id="lastUpdated">—</span></div>
      </div>

      <div class="weather-card" id="weatherCard" style="display:none;">
        <div class="icon" id="weatherIcon">☀️</div>
        <div class="details">
          <div class="temp" id="temp">--°C</div>
          <div class="desc" id="description">—</div>
          <div class="stats" id="stats"></div>
        </div>
      </div>

      <div class="card" id="errorCard" style="display:none; color:#ffb4b4;">
        <strong id="errorMsg">Error</strong>
      </div>
    </div>

    <div class="right">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong>Settings</strong>
          <div class="toggle">
            <label class="small" for="units">°C / °F</label>
            <select id="units" title="units">
              <option value="metric">°C</option>
              <option value="imperial">°F</option>
            </select>
          </div>
        </div>
        <div style="margin-top:12px;">
          <button class="btn-geo" id="geoBtn">Use my location</button>
          <div class="small" style="margin-top:8px;">Tip: Click city name to copy it.</div>
        </div>
      </div>

      <div class="card">
        <strong>Extras</strong>
        <ul style="margin-top:10px; color:var(--muted); font-size:14px; line-height:1.6;">
          <li>Dynamic background based on weather (sunny/rainy/clouds)</li>
          <li>Save last city (auto-load on open)</li>
          <li>Keyboard enter to search</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "230d4a4f2117eb8411c83ff0c7ad602e";

    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const cityNameEl = document.getElementById('cityName');
    const tempEl = document.getElementById('temp');
    const descEl = document.getElementById('description');
    const iconEl = document.getElementById('weatherIcon');
    const statsEl = document.getElementById('stats');
    const card = document.getElementById('weatherCard');
    const errCard = document.getElementById('errorCard');
    const errorMsg = document.getElementById('errorMsg');
    const unitsSelect = document.getElementById('units');
    const geoBtn = document.getElementById('geoBtn');
    const lastUpdated = document.getElementById('lastUpdated');
    const timeLocal = document.getElementById('timeLocal');

    function showError(msg){
      errCard.style.display='block';
      errorMsg.textContent = msg;
      card.style.display='none';
    }
    function hideError(){
      errCard.style.display='none';
    }
    function formatTimeFromUnix(unix, tzOffsetSec){
      const d = new Date((unix + tzOffsetSec) * 1000);
      return d.toLocaleString();
    }
    function setBackgroundByWeather(main){
      const page = document.getElementById('page');
      const m = main.toLowerCase();
      if(m.includes('cloud')) page.style.background = "linear-gradient(180deg,#253244,#071025 90%)";
      else if(m.includes('rain') || m.includes('drizzle')) page.style.background = "linear-gradient(180deg,#1f2a3a,#07101a 90%)";
      else if(m.includes('snow')) page.style.background = "linear-gradient(180deg,#3b5a6a,#07101a 90%)";
      else page.style.background = "linear-gradient(180deg,#0b5266,#071026 90%)";
    }
    function iconFromCode(code){
      if(!code) return '❔';
      const c = code.slice(0,2);
      if(code.endsWith('d')){
        if(c==='01') return '☀️';
        if(c==='02') return '⛅';
        if(c==='03'||c==='04') return '☁️';
        if(c==='09'||c==='10') return '🌧️';
        if(c==='11') return '⛈️';
        if(c==='13') return '❄️';
        if(c==='50') return '🌫️';
      } else {
        if(c==='01') return '🌙';
        if(c==='02'||c==='03'||c==='04') return '☁️';
        if(c==='09'||c==='10') return '🌧️';
        if(c==='11') return '⛈️';
        if(c==='13') return '❄️';
        if(c==='50') return '🌫️';
      }
      return '🌤️';
    }

    const indianCities = ["delhi","mumbai","bangalore","kolkata","chennai","hyderabad"];

    async function fetchWeatherByCity(city, units='metric'){
      if(!API_KEY){
        showError("Please set your OpenWeather API key.");
        return;
      }
      hideError();

      if(indianCities.includes(city.toLowerCase())){
        city += ",IN";
      }

      try{
        const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=${units}&appid=${API_KEY}`;
        const res = await fetch(url);
        if(!res.ok){
          if(res.status === 404) throw new Error("City not found. Check spelling.");
          else if(res.status === 401) throw new Error("Invalid API key. Make sure your key is active.");
          else throw new Error("Network error: " + res.status);
        }
        const data = await res.json();
        renderWeather(data, units);
        localStorage.setItem('lastCity', city);
        localStorage.setItem('units', units);
      }catch(err){
        showError(err.message);
        console.error(err);
      }
    }

    async function fetchWeatherByCoords(lat, lon, units='metric'){
      if(!API_KEY){
        showError("Please set your OpenWeather API key.");
        return;
      }
      hideError();
      try{
        const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=${units}&appid=${API_KEY}`;
        const res = await fetch(url);
        if(!res.ok) throw new Error("Unable to fetch for coordinates.");
        const data = await res.json();
        renderWeather(data, units);
        localStorage.setItem('lastCity', data.name);
        localStorage.setItem('units', units);
      }catch(err){
        showError(err.message);
        console.error(err);
      }
    }

    function renderWeather(data, units){
      if(!data) return;
      card.style.display='flex';
      hideError();
      const name = data.name + (data.sys?.country ? ", "+data.sys.country : "");
      cityNameEl.textContent = name;
      cityNameEl.title = "Click to copy";
      cityNameEl.onclick = () => { navigator.clipboard?.writeText(name); };
      const temp = Math.round(data.main.temp);
      const unitSymbol = units==='metric' ? '°C' : '°F';
      tempEl.textContent = `${temp}${unitSymbol}`;
      descEl.textContent = data.weather?.[0]?.description || '—';
      iconEl.textContent = iconFromCode(data.weather?.[0]?.icon);
      statsEl.innerHTML = `
        <div class="stat">Feels like: ${Math.round(data.main.feels_like)}${unitSymbol}</div>
        <div class="stat">Humidity: ${data.main.humidity}%</div>
        <div class="stat">Wind: ${Math.round(data.wind.speed)} ${units==='metric'?'m/s':'mph'}</div>
        <div class="stat">Pressure: ${data.main.pressure} hPa</div>
      `;
      timeLocal.textContent = formatTimeFromUnix(data.dt, data.timezone);
      lastUpdated.textContent = new Date().toLocaleString();
      setBackgroundByWeather(data.weather?.[0]?.main || '');
      if(window.innerWidth < 880) window.scrollTo({top:0, behavior:'smooth'});
    }

    searchBtn.addEventListener('click', () => {
      const city = cityInput.value.trim();
      if(!city){ showError("Please enter a city name."); return; }
      fetchWeatherByCity(city, unitsSelect.value);
    });

    cityInput.addEventListener('keydown', e => { if(e.key==='Enter') searchBtn.click(); });
    unitsSelect.addEventListener('change', () => {
      const last = localStorage.getItem('lastCity');
      if(last) fetchWeatherByCity(last, unitsSelect.value);
    });
    geoBtn.addEventListener('click', () => {
      if(!navigator.geolocation){ showError("Geolocation not supported."); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        const {latitude, longitude} = pos.coords;
        fetchWeatherByCoords(latitude, longitude, unitsSelect.value);
      }, err => { showError("Permission denied or unable to get location."); });
    });

    window.addEventListener('load', () => {
      const last = localStorage.getItem('lastCity');
      const savedUnits = localStorage.getItem('units');
      if(savedUnits) unitsSelect.value = savedUnits;
      if(last){
        cityInput.value = last;
        fetchWeatherByCity(last, unitsSelect.value);
      }
    });
  </script>
</body>
</html>
